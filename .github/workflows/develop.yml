name: CI/CD — Web (Develop)

on:
  push:
    branches:
      - main

env:
  REGISTRY: docker.io
  IMAGE: ${{ secrets.DOCKER_USERNAME }}/saldoreal-web

jobs:
  # ──────────────────────────────────────────────────────────────
  # JOB 1: Build e Push da imagem Docker
  # ──────────────────────────────────────────────────────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e Push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:develop
            ${{ env.IMAGE }}:develop-${{ github.sha }}
          # Números do WhatsApp injetados em tempo de build
          build-args: |
            WHATSAPP_BOT_NUMBER=${{ secrets.WHATSAPP_BOT_NUMBER }}
            WHATSAPP_SUPPORT_NUMBER=${{ secrets.WHATSAPP_SUPPORT_NUMBER }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:develop
          cache-to: type=inline

  # ──────────────────────────────────────────────────────────────
  # JOB 2: Deploy na máquina via SSH
  # ──────────────────────────────────────────────────────────────
  deploy:
    name: Deploy — Staging
    runs-on: ubuntu-latest
    needs: docker
    environment: develop

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar chave SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Adicionar host ao known_hosts
        run: |
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Copiar docker-compose para o servidor
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} mkdir -p /opt/saldoreal-web
          scp docker-compose.yml \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/saldoreal-web/docker-compose.yml

      - name: Deploy via SSH
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
          set -e
          cd /opt/saldoreal-web

          # ── Gera o .env com a tag da imagem ────────────────────────────
          cat > .env << 'ENVEOF'
          WEB_IMAGE=${{ env.IMAGE }}:develop-${{ github.sha }}
          ENVEOF

          # Pull da nova imagem e (re)sobe o container
          docker compose pull web
          docker compose up -d --no-build web --remove-orphans

          # Remove imagens antigas para liberar espaço em disco
          docker image prune -f
          EOF

      - name: Verificar se o container está rodando
        run: |
          echo "Aguardando o container inicializar..."
          sleep 10
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "docker inspect --format='{{.State.Status}}' saldoreal_web"
